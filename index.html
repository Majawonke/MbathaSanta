<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Santa Picker</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: linear-gradient(to bottom, #ffefba, #ffffff);
      min-height: 100vh;
      position: relative;
    }

    h1 {
      color: #c0392b;
      text-shadow: 2px 2px 5px #2c3e50;
      font-size: 3em;
      margin-bottom: 0.2em;
    }

    p {
      color: #2c3e50;
      font-size: 18px;
    }

    select, button {
      margin: 5px;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #c0392b;
      cursor: pointer;
      transition: 0.3s;
    }

    select {
      background-color: #fff;
    }

    button {
      background-color: #e74c3c;
      color: white;
    }

    button:hover:not(:disabled) {
      background-color: #c0392b;
      transform: scale(1.05);
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #name-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    #name-buttons button {
      margin: 10px;
      width: 140px;
    }

    #selected {
      margin-top: 20px;
      font-weight: bold;
      font-size: 20px;
      color: #27ae60;
    }

    .snowflake {
      color: #fff;
      font-size: 1.5em;
      position: absolute;
      top: -10px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg);}
      100% { transform: translateY(100vh) rotate(360deg);}
    }
  </style>
</head>
<body>

  <h1>🎄 Secret Santa 🎁</h1>
  <p>Select your name:</p>
  <select id="user-name">
    <option value="" disabled selected>-- Choose your name --</option>
  </select>
  <button id="start-btn">Start</button>

  <div id="picker" style="display:none;">
    <p>Click a button to utsengela someone:</p>
    <div id="name-buttons"></div>
    <p id="selected"></p>
  </div>

  <!-- Hidden Formspree form -->
  <form id="email-form" action="https://formspree.io/f/xnjqeyod" method="POST" style="display:none;">
    <input type="text" name="user_name" id="form-user-name">
    <input type="text" name="picked_name" id="form-picked-name">
    <button type="submit" id="form-submit">Send</button>
  </form>

  <script>
    // Snowflakes
    const snowCount = 20;
    for(let i=0;i<snowCount;i++){
      const snow = document.createElement('div');
      snow.classList.add('snowflake');
      snow.textContent = '❄';
      snow.style.left = Math.random()*100 + 'vw';
      snow.style.animationDuration = (5 + Math.random()*10) + 's';
      snow.style.fontSize = (10 + Math.random()*20) + 'px';
      document.body.appendChild(snow);
    }

    // Secret Santa functionality
    const names = ["Sesi Victoria","Sesi Phindile","Sesi Zodwa","Gcina","Sesi Bonisile","Sesi Nomsa","Sesi Agnes","Sesi Ntombi"];
    const picked = new Set();
    let userName = "";
    let hasPicked = false;

    const userSelect = document.getElementById('user-name');
    const startBtn = document.getElementById('start-btn');
    const pickerDiv = document.getElementById('picker');
    const container = document.getElementById('name-buttons');
    const selectedDisplay = document.getElementById('selected');

    // Populate dropdown
    names.forEach(name => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      userSelect.appendChild(option);
    });

    startBtn.onclick = () => {
      const selected = userSelect.value;
      if (!selected) {
        alert("Please select your name!");
        return;
      }
      userName = selected;
      userSelect.style.display = "none";
      startBtn.style.display = "none";
      pickerDiv.style.display = "block";
      renderButtons();
    };

    function renderButtons() {
      container.innerHTML = '';
      names.forEach(name => {
        if (name === userName) return;
        const btn = document.createElement('button');
        btn.textContent = "Pick a name";
        btn.disabled = picked.has(name) || hasPicked;
        btn.onclick = () => {
          picked.add(name);
          hasPicked = true;
          selectedDisplay.textContent = `🎁 Utsengela: ${name} 🎁`;
          renderButtons();

          // Submit to Formspree
          document.getElementById('form-user-name').value = userName;
          document.getElementById('form-picked-name').value = name;
          document.getElementById('form-submit').click();
        };
        container.appendChild(btn);
      });
    }
  </script>

</body>
</html>
